backend:
  name: turbo-github
  turbo_site_id: 7574c83c-3524-4031-98b3-ca2102acfde9
  branch: main
media_folder: "images"
public_folder: "/images"

collections:
  - name: "cardapio"
    label: "Cardápio"
    files:
      - name: "pratos"
        label: "Pratos do restaurante"
        file: "content/cardapio.json"
        fields:
          - label: "Pratos"
            name: "pratos"
            widget: "list"
            fields:
              - { label: "Nome", name: "nome", widget: "string" }
              - { label: "Descrição", name: "descricao", widget: "text" }
              - { label: "Preço", name: "preco", widget: "string" }
              - { label: "Foto", name: "foto", widget: "image", required: false }
