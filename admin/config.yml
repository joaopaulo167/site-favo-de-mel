backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "paginas"
    label: "Páginas"
    files:
      - name: "inicio"
        label: "Página inicial"
        file: "content/inicio.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Texto", name: "body", widget: "markdown" 
