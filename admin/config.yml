backend:
  name: turbo-github
  turbo_site_id: 7574c83c-3524-4031-98b3-ca2102acfde9
  branch: main
media_folder: "images"
public_folder: "/images"

collections:
  - name: "paginas"
    label: "Páginas"
    files:
      - name: "inicio"
        label: "Página inicial"
        file: "content/inicio.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Texto", name: "body", widget: "markdown"}
